<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Age Calculator</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="design-root">
    <div class="layout-container">
      <main>
        <div class="content-container">
          <div class="content-wrapper">
            <!-- Input Section -->
            <form id="ageForm" class="input-form">
              <!-- Day Input -->
              <label class="input-label">
                <p class="input-label-text">Day</p>
                <input id="dayInput" class="form-input" placeholder="DD" type="number" min="1" max="31"/>
                <p id="dayError" class="error-text hidden">This field is required</p>
              </label>
              <!-- Month Input -->
              <label class="input-label">
                <p class="input-label-text">Month</p>
                <input id="monthInput" class="form-input" placeholder="MM" type="number" min="1" max="12"/>
                <p id="monthError" class="error-text hidden">Must be a valid month</p>
              </label>
              <!-- Year Input -->
              <label class="input-label">
                <p class="input-label-text">Year</p>
                <input id="yearInput" class="form-input" placeholder="YYYY" type="number" min="1800"/>
                <p id="yearError" class="error-text hidden">Must be in the past</p>
              </label>
            </form>
            <!-- Divider and Button Section -->
            <div class="divider-section">
              <hr class="divider"/>
              <button id="calculateBtn" class="calculate-button">
                <span class="material-symbols-outlined button-icon">arrow_downward</span>
              </button>
            </div>
            <!-- Results Section -->
            <div class="results-section">
              <div class="result-item">
                <p id="yearsResult" class="result-number">--</p>
                <p class="result-label">years</p>
              </div>
              <div class="result-item">
                <p id="monthsResult" class="result-number">--</p>
                <p class="result-label">months</p>
              </div>
              <div class="result-item">
                <p id="daysResult" class="result-number">--</p>
                <p class="result-label">days</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
